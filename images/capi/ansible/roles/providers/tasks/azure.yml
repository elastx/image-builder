---
# The Canonical Ubuntu 26.04 (resolute) Azure Marketplace image ships a legacy
# Microsoft "prod" apt source pinned to ubuntu/18.04 whose signing key is not in
# the keyring. Ubuntu 26.04 removed apt-key and enforces signed-by, so the first
# `apt update` of the build fails with:
#   NO_PUBKEY EB3E94ADBE1229CF ... 'https://packages.microsoft.com/ubuntu/18.04/prod
#   bionic InRelease' is not signed
# image-builder does not rely on this repo for node images (azure-cli is only
# installed when debug_tools is set, from its own signed-by repo), so drop the
# stale source before any apt cache update. No-op on images that don't ship it.
- name: Find stale Microsoft prod apt sources shipped on the base image
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns:
      - "*.list"
      - "*.sources"
    contains: ".*packages\\.microsoft\\.com/ubuntu/18\\.04.*"
  register: stale_ms_apt_sources
  when: ansible_facts['os_family'] == "Debian"

- name: Remove stale Microsoft prod apt sources shipped on the base image
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ stale_ms_apt_sources.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: ansible_facts['os_family'] == "Debian"

- name: Import Azure CLI tasks
  ansible.builtin.import_tasks: azurecli.yml
  when: debug_tools | bool

- name: Configure PTP
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    create: true
    line: refclock PHC /dev/ptp0 poll 3 dpoll -2 offset 0
    mode: "0644"
  # Flatcar now includes this by default as of 3975.2.0 which causes this task to fail
  when: >
    ansible_facts['os_family'] != "Flatcar" or
    (ansible_facts['os_family'] == "Flatcar" and
    ansible_facts['distribution_version'] is version('3975.2.0', '<'))

- name: Ensure makestep parameter set as per Azure recommendation
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: ^makestep
    line: makestep 1.0 -1
  # Flatcar now includes this by default as of 3975.2.0 which causes this task to fail
  when: >
    ansible_facts['os_family'] != "Flatcar" or
    (ansible_facts['os_family'] == "Flatcar" and
    ansible_facts['distribution_version'] is version('3975.2.0', '<'))

- name: Install iptables persistence
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    force_apt_get: true
  vars:
    packages:
      - iptables-persistent
  when: ansible_facts['os_family'] == "Debian"

- name: Block traffic to 168.63.129.16 port 80 for cve-2021-27075
  ansible.builtin.copy:
    src: files/etc/azure/iptables
    dest: /etc/iptables/rules.v4
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"

- name: Load iptable rules from file
  community.general.iptables_state:
    state: restored
    path: /etc/iptables/rules.v4
  when: ansible_facts['os_family'] == "Debian"

- name: Install netbase and nfs-common
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: present
    force_apt_get: true
  vars:
    packages:
      - netbase
      - nfs-common
  when: ansible_facts['os_family'] == "Debian"

## refer to ../files/etc/cloud/cloud.cfg.d/15_azure-vnet.cfg
## for more context on below file addition
- name: Create azure-vnet config file
  ansible.builtin.copy:
    src: files/etc/cloud/cloud.cfg.d/15_azure-vnet.cfg
    dest: /etc/cloud/cloud.cfg.d/15_azure-vnet.cfg
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['os_family'] == "Debian"

- name: Create the credential provider path
  ansible.builtin.file:
    path: /var/lib/kubelet/credential-provider
    state: directory
    mode: "0755"

- name: Download OOT credential provider
  ansible.builtin.get_url:
    url: https://github.com/kubernetes-sigs/cloud-provider-azure/releases/latest/download/azure-acr-credential-provider-linux-amd64
    dest: /var/lib/kubelet/credential-provider/acr-credential-provider
    mode: "0755"

- name: Download OOT credential provider config file
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/kubernetes-sigs/cloud-provider-azure/master/examples/out-of-tree/credential-provider-config.yaml
    dest: /var/lib/kubelet/credential-provider-config.yaml
    mode: "0644"
